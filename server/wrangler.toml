name = "kouga-ranking"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "kouga-ranking"
database_id = "PUT-YOUR-DATABASE-ID-HERE"   # printed by: npx wrangler d1 create kouga-ranking

[vars]
# the ranking event: runs started in this window count (ISO time with the time zone)
EVENT_START = "2026-11-10T18:00:00+09:00"
EVENT_END   = "2026-11-13T18:00:00+09:00"
ALLOWED_ORIGIN = "*"   # later: the address the game is served from, e.g. "https://kkkougaa.github.io"
# ADMIN_KEY is a secret, not a var: npx wrangler secret put ADMIN_KEY
